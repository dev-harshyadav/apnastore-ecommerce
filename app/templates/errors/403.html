{% extends "base.html" %}

{% block title %}Access Restricted (403) — {{ store_name }}{% endblock %}

{% block content %}
<div class="container section" style="display: flex; justify-content: center; align-items: center; min-height: 50vh;">
  <div class="empty-state" style="max-width: 540px;">
    <div class="empty-state-icon" style="color: var(--color-danger); background-color: var(--color-danger-bg);">
      <i data-lucide="lock" style="width: 32px; height: 32px;"></i>
    </div>
    <span class="section-eyebrow">403 Forbidden</span>
    <h1 class="empty-state-title" style="margin-top: var(--space-2);">Access Restricted</h1>
    <p class="empty-state-text">
      You do not have permission to view this order confirmation or administrative resource.
    </p>
    <a href="{{ url_for('storefront.home') }}" class="btn btn-primary">
      Return to Storefront
    </a>
  </div>
</div>
{% endblock %}
